# CI only: lint + tests. Live trading via GitHub Actions is deliberately NOT
# supported (6h job cap, unreliable cron, ephemeral IPs, GitHub ToS) — see README.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -v
